name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Homepage.exe
        run: dotnet publish Homepage.csproj -c Release -o dist
      - name: Publish latest download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest dist/Homepage.exe --target $env:GITHUB_SHA --title "Latest" --notes "Built automatically from the newest code. Download Homepage.exe and run it."
